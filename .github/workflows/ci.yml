name: CI Quality & Database Contract Gate

on:
  push:
    branches:
      - main
  pull_request:
  # Lets a main commit get a green run on demand (e.g. after a [skip ci] push) so the
  # release promotion gate has something to match.
  workflow_dispatch:

permissions:
  contents: read


env:
  SMART_TESTS_TOKEN: ${{ secrets.SMART_TESTS_TOKEN }}
  SMART_TESTS_BUILD: run-${{ github.run_id }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-unit-tests:
    name: Analyze, Unit/Widget Tests & Coverage Ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Full history so `smart-tests record build` can collect commit data.
          fetch-depth: 0

      - name: Set up Flutter & Dependencies
        uses: ./.github/actions/setup-flutter

      - name: Generate Local CI Environment Stub
        run: |
          cat <<'EOF' > .env
          SUPABASE_URL=http://127.0.0.1:54321
          SUPABASE_PUBLISHABLE_KEY=ci-anon-stub-key
          GOOGLE_WEB_CLIENT_ID=ci-google-web-client-id.apps.googleusercontent.com
          GOOGLE_IOS_CLIENT_ID=ci-google-ios-client-id.apps.googleusercontent.com
          EOF

      - name: Run Code Generation (Slang & Build Runner)
        run: |
          dart run slang
          dart run build_runner build

      - name: Check Formatting (Hand-Written Dart Files)
        run: git ls-files -z '*.dart' | xargs -0 dart format --output=none --set-exit-if-changed

      - name: Run Strict Static Analysis
        run: dart analyze --fatal-infos

      - name: Set up Smart Tests CLI
        if: env.SMART_TESTS_TOKEN != ''
        continue-on-error: true
        uses: ./.github/actions/setup-smart-tests

      - name: Record Smart Tests Build & Session (Unit/Widget)
        if: env.SMART_TESTS_TOKEN != ''
        continue-on-error: true
        run: |
          smart-tests record build --build "$SMART_TESTS_BUILD" --source .
          smart-tests record session \
            --build "$SMART_TESTS_BUILD" \
            --test-suite unit-widget \
            --observation > smart-tests-session.txt

      - name: Request Smart Tests Subset (Observation — Full Suite)
        if: env.SMART_TESTS_TOKEN != ''
        continue-on-error: true
        # Observation mode returns the full suite; the list still trains the model and the
        # dashboard records what a real subset would have selected/saved.
        run: |
          smart-tests subset \
            --session @smart-tests-session.txt \
            --target 25% \
            flutter $(find test -name '*_test.dart' -not -name 'supabase_*_test.dart' | sort) \
            > smart-tests-subset.txt

      - name: Run Fast Unit, Controller & Widget Tests With Coverage
        # dart_test.yaml runs one test file at a time, for the integration suites that share a
        # Supabase stack. These tests share nothing, so their files run side by side.
        # SUBSET is the observation full-suite list when Smart Tests is active, else empty
        # (flutter then runs everything, minus the integration tag).
        run: |
          SUBSET="$([ -f smart-tests-subset.txt ] && cat smart-tests-subset.txt || true)"
          flutter test $SUBSET \
            --exclude-tags integration --concurrency "$(nproc)" --coverage \
            --file-reporter "json:smart-tests-report.json"

      - name: Record Smart Tests Results (Unit/Widget)
        if: always() && env.SMART_TESTS_TOKEN != ''
        continue-on-error: true
        run: |
          [ -f smart-tests-report.json ] || { echo "No report to record"; exit 0; }
          smart-tests record tests --session @smart-tests-session.txt flutter smart-tests-report.json

      - name: Enforce DDD Layer & Total Coverage Ratchet
        run: dart run tool/check_coverage.dart --min-domain=87 --min-controllers=83 --min-data=75 --min-ui=83 --min-total=83

      - name: Verify WebAssembly (Wasm) Build
        run: flutter build web --wasm

  supabase-contracts-and-e2e:
    name: Supabase Migrations, SQL Contracts & E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Full history so `smart-tests record build` can collect commit data.
          fetch-depth: 0

      - name: Set up Flutter & Dependencies
        uses: ./.github/actions/setup-flutter

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # Pinned to match the local CLI and avoid GitHub API rate limits on `latest`.
          version: v2.117.0

      - name: Start Local Supabase Stack (Clean Migration + Seed Replay)
        run: supabase start -x studio,vector

      - name: Run Self-Asserting SQL RLS & RPC Contract Suite
        run: |
          docker exec -i supabase_db_postfolio \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres -f - \
            < supabase/tests/rd_ledger_facts_rls.sql

      - name: Generate CI Environment & Code
        run: |
          cat <<'EOF' > .env
          SUPABASE_URL=http://127.0.0.1:54321
          SUPABASE_PUBLISHABLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          GOOGLE_WEB_CLIENT_ID=ci-google-web-client-id.apps.googleusercontent.com
          GOOGLE_IOS_CLIENT_ID=ci-google-ios-client-id.apps.googleusercontent.com
          EOF
          dart run slang
          dart run build_runner build

      - name: Set up Smart Tests CLI
        if: env.SMART_TESTS_TOKEN != ''
        continue-on-error: true
        uses: ./.github/actions/setup-smart-tests

      - name: Record Smart Tests Build & Session (Integration/E2E)
        if: env.SMART_TESTS_TOKEN != ''
        continue-on-error: true
        # Same build name as the unit/widget job = one logical build; this re-asserts it,
        # then attaches this suite's own session.
        run: |
          smart-tests record build --build "$SMART_TESTS_BUILD" --source .
          smart-tests record session \
            --build "$SMART_TESTS_BUILD" \
            --test-suite integration-e2e \
            --observation > smart-tests-session.txt

      - name: Request Smart Tests Subset (Observation — Full Suite)
        if: env.SMART_TESTS_TOKEN != ''
        continue-on-error: true
        run: |
          smart-tests subset \
            --session @smart-tests-session.txt \
            --target 25% \
            flutter $(find test -maxdepth 1 -name 'supabase_*_test.dart' | sort) \
            > smart-tests-subset.txt

      - name: Run Dart Supabase Integration & E2E Suites
        run: |
          SUBSET="$([ -f smart-tests-subset.txt ] && cat smart-tests-subset.txt || true)"
          flutter test $SUBSET --tags integration \
            --file-reporter "json:smart-tests-report.json"

      - name: Record Smart Tests Results (Integration/E2E)
        if: always() && env.SMART_TESTS_TOKEN != ''
        continue-on-error: true
        run: |
          [ -f smart-tests-report.json ] || { echo "No report to record"; exit 0; }
          smart-tests record tests --session @smart-tests-session.txt flutter smart-tests-report.json
