name: App Release Pipeline

on:
  push:
    tags:
      - 'v*' # Triggers when you push a tag like v2.4.0+23
  workflow_dispatch:
    inputs:
      deploy_live:
        description: 'Deploy to Google Play Store & Live Web Hosting'
        required: false
        default: false
        type: boolean
      play_track:
        description: 'Google Play track override (defaults to PLAY_STORE_TRACK variable or alpha)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - internal
          - alpha
          - beta
          - production

# REQUIRED: Give the GITHUB_TOKEN write access to create releases on tag pushes
permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Verify, Release, and Distribute
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Read the Pinned Flutter Version
        id: sdk
        run: |
          version="$(jq -er .flutter .fvmrc)"
          echo "flutter=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # The SDK the code is developed and tested on, pinned once in .fvmrc (as in ci.yml).
          # An unpinned 'stable' moved to 3.50, whose new deprecations fail the gate below.
          flutter-version: ${{ steps.sdk.outputs.flutter }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Environment File
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: |
          cat <<EOF > .env
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID
          GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID
          EOF

      - name: Run Code Generation
        run: |
          dart run slang
          dart run build_runner build

      - name: Run Static Analysis & Fast Test Gate
        run: |
          dart analyze --fatal-infos
          flutter test --exclude-tags integration --concurrency "$(nproc)"

      - name: Configure Android Signing Keystore
        id: signing
        # Prefers production UPLOAD_KEYSTORE_BASE64 + KEY_PROPERTIES when configured in GitHub Secrets;
        # falls back cleanly to legacy KEYSTORE_BASE64 so existing tester SHA-1 workflows never break.
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ] && [ -n "$KEY_PROPERTIES" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            printf '%s\n' "$KEY_PROPERTIES" > android/key.properties
            echo "has_upload_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/debug.keystore
            echo "has_upload_keystore=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "has_play_credentials=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_play_credentials=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android App Bundle (for Google Play)
        run: flutter build appbundle --flavor prod --release

      - name: Upload Signed App Bundle Artifact
        if: steps.signing.outputs.has_upload_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: postfolio-prod-aab
          path: |
            build/app/outputs/bundle/prodRelease/app-prod-release.aab
            build/app/outputs/mapping/prodRelease/mapping.txt
          retention-days: 14

      - name: Build Split APKs (for GitHub Release)
        run: flutter build apk --flavor prod --split-per-abi --release

      - name: Build Web Release (Wasm + JS Fallback)
        run: flutter build web --wasm

      - name: Extract Release Notes
        id: release_notes
        uses: ffurrer2/extract-release-notes@v2

      - name: Write Release Notes to File
        env:
          CHANGELOG: ${{ steps.release_notes.outputs.release_notes }}
        run: |
          printf '%s\n' "$CHANGELOG" > release-notes.txt
          mkdir -p whatsnew
          # Google Play limits per-locale "What's new" notes to 500 characters.
          printf '%s\n' "$CHANGELOG" | head -c 500 > whatsnew/whatsnew-en-US

      - name: Upload to Google Play
        if: >-
          (startsWith(github.ref, 'refs/tags/v') || inputs.deploy_live == true)
          && steps.signing.outputs.has_upload_keystore == 'true'
          && steps.signing.outputs.has_play_credentials == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.darshanas.postfolio
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          mappingFile: build/app/outputs/mapping/prodRelease/mapping.txt
          tracks: ${{ inputs.play_track || vars.PLAY_STORE_TRACK || 'alpha' }}
          status: ${{ vars.PLAY_STORE_RELEASE_STATUS || 'completed' }}
          whatsNewDirectory: whatsnew

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-*.apk
          body: ${{ steps.release_notes.outputs.release_notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Firebase Hosting
        if: startsWith(github.ref, 'refs/tags/v') || inputs.deploy_live == true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_CREDENTIAL_FILE_CONTENT }}
          channelId: live
          projectId: postfolio-app
          # Pinned: the action defaults to firebase-tools@latest, and an upstream change
          # (a Service Usage pre-check) broke the v2.3.0+21 deploy without any repo change.
          # Bump deliberately; the CI service account needs Firebase Hosting Admin +
          # Service Usage Consumer.
          firebaseToolsVersion: 15.35.0
