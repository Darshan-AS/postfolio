name: App Release Pipeline

on:
  push:
    tags:
      - 'v*' # Triggers when you push a tag like v2.4.0+23
  workflow_dispatch:
    inputs:
      deploy_live:
        description: 'Deploy to Firebase App Distribution & Live Hosting'
        required: false
        default: false
        type: boolean

# REQUIRED: Give the GITHUB_TOKEN write access to create releases on tag pushes
permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Verify, Release, and Distribute
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Environment File
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: |
          cat <<EOF > .env
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID
          GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID
          EOF

      - name: Run Code Generation
        run: |
          dart run slang
          dart run build_runner build --delete-conflicting-outputs

      - name: Run Static Analysis & Fast Test Gate
        run: |
          dart analyze --fatal-infos
          flutter test --exclude-tags integration

      - name: Configure Android Signing Keystore
        # Prefers production UPLOAD_KEYSTORE_BASE64 + KEY_PROPERTIES when configured in GitHub Secrets;
        # falls back cleanly to legacy KEYSTORE_BASE64 so existing tester SHA-1 workflows never break.
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ] && [ -n "$KEY_PROPERTIES" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            printf '%s\n' "$KEY_PROPERTIES" > android/key.properties
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/debug.keystore
          fi

      - name: Build Universal APK (for Firebase)
        run: flutter build apk --flavor prod --release

      - name: Build Split APKs (for GitHub Release)
        run: flutter build apk --flavor prod --split-per-abi --release

      - name: Build Web Release (Wasm + JS Fallback)
        run: flutter build web --wasm

      - name: Extract Release Notes
        id: release_notes
        uses: ffurrer2/extract-release-notes@v2

      - name: Write Release Notes to File
        env:
          CHANGELOG: ${{ steps.release_notes.outputs.release_notes }}
        run: echo "$CHANGELOG" > release-notes.txt

      - name: Upload to Firebase App Distribution
        if: startsWith(github.ref, 'refs/tags/v') || inputs.deploy_live == true
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIAL_FILE_CONTENT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-prod-release.apk
          releaseNotesFile: release-notes.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-*.apk
          body: ${{ steps.release_notes.outputs.release_notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Firebase Hosting
        if: startsWith(github.ref, 'refs/tags/v') || inputs.deploy_live == true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_CREDENTIAL_FILE_CONTENT }}
          channelId: live
          projectId: postfolio-app
          # Pinned: the action defaults to firebase-tools@latest, and an upstream change
          # (a Service Usage pre-check) broke the v2.3.0+21 deploy without any repo change.
          # Bump deliberately; the CI service account needs Firebase Hosting Admin +
          # Service Usage Consumer.
          firebaseToolsVersion: 15.35.0
