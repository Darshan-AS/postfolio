name: App Release Pipeline

on:
  push:
    tags:
      - 'v*' # Triggers when you push a tag like v1.0.0
  workflow_dispatch: # Allows manual triggering

# REQUIRED: Give the GITHUB_TOKEN write access to create releases
permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Release, and Distribute
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Environment File
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          USE_SUPABASE: ${{ secrets.USE_SUPABASE }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: |
          cat <<EOF > .env
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          USE_SUPABASE=$USE_SUPABASE
          GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID
          GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID
          EOF

      - name: Run Code Generation
        run: |
          dart run slang
          dart run build_runner build --delete-conflicting-outputs

      - name: Decode Keystore
        # Decodes the base64 keystore secret and injects it into the android/app folder.
        # This ensures the CI build has the exact same SHA-1 hash registered in Firebase,
        # which is strictly required for Google Sign-In to work on distributed apps.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/debug.keystore

      - name: Build Universal APK (for Firebase)
        # Generates a single APK that works on all devices for beta testers
        run: flutter build apk --flavor prod --release

      - name: Build Split APKs (for GitHub Release)
        # Generates per-architecture APKs to keep download sizes small on GitHub
        run: flutter build apk --flavor prod --split-per-abi --release

      - name: Extract Release Notes
        # Extracts release notes for the current version from CHANGELOG.md
        id: release_notes
        uses: ffurrer2/extract-release-notes@v2

      - name: Write Release Notes to File
        env:
          CHANGELOG: ${{ steps.release_notes.outputs.release_notes }}
        run: echo "$CHANGELOG" > release-notes.txt

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIAL_FILE_CONTENT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-prod-release.apk
          # We pass the generated changelog file directly to Firebase
          releaseNotesFile: release-notes.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/flutter-apk/app-*.apk
          # We pass the EXACT same changelog to GitHub Releases
          body: ${{ steps.release_notes.outputs.release_notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Web (For Parity)
        run: flutter build web

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_CREDENTIAL_FILE_CONTENT }}
          channelId: live
          projectId: postfolio-app
