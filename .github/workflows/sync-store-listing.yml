name: Sync Google Play Store Listing

on:
  workflow_dispatch:
    inputs:
      locale:
        description: 'Play Store listing locale'
        required: true
        default: 'en-US'
        type: choice
        options:
          - en-US
          - en-IN
      track:
        description: 'Active Play track used for API edit lookup (store listing is app-wide)'
        required: true
        default: 'alpha'
        type: choice
        options:
          - alpha
          - internal
          - beta
          - production
      upload_metadata:
        description: 'Sync title, short description, and full description'
        required: true
        default: true
        type: boolean
      upload_images:
        description: 'Sync app icon, feature graphic, and screenshots'
        required: true
        default: true
        type: boolean
      validate_only:
        description: 'Validate with Play API without publishing changes (dry run)'
        required: true
        default: true
        type: boolean
      changes_not_sent_for_review:
        description: 'Save changes as draft in Play Console without sending for review'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  sync-store-listing:
    name: Sync Play Store Listing (${{ inputs.locale }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: android

      - name: Configure Google Play Service Account
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          ruby -rjson -rbase64 -e '
            raw = ENV["GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"].to_s.strip
            if raw.empty?
              warn "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is empty."
              exit 1
            end

            parsed = nil
            begin
              parsed = JSON.parse(raw)
            rescue JSON::ParserError
              begin
                decoded = Base64.decode64(raw)
                parsed = JSON.parse(decoded)
              rescue JSON::ParserError => e
                warn "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is neither valid JSON nor base64-encoded JSON (length=#{raw.bytesize}, starts_with_brace=#{raw.start_with?("{")}, error=#{e.class}). Re-paste the raw service account JSON file contents into the GitHub Secret."
                exit 1
              end
            end

            required_keys = %w[type client_email private_key]
            unless parsed.is_a?(Hash) && required_keys.all? { |k| parsed[k].is_a?(String) && !parsed[k].empty? }
              warn "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is missing required service account fields (type, client_email, private_key)."
              exit 1
            end

            out_path = File.join(ENV.fetch("RUNNER_TEMP"), "play-service-account.json")
            File.write(out_path, JSON.generate(parsed))
            File.chmod(0o600, out_path)
          '

      - name: Stage Fastlane Metadata & Store Graphics
        env:
          LOCALE: ${{ inputs.locale }}
          UPLOAD_IMAGES: ${{ inputs.upload_images }}
        run: |
          STAGED_LOCALE_DIR="$RUNNER_TEMP/fastlane_metadata/android/$LOCALE"
          mkdir -p "$STAGED_LOCALE_DIR"
          cp android/fastlane/metadata/android/en-US/*.txt "$STAGED_LOCALE_DIR/"

          if [ "$UPLOAD_IMAGES" = "true" ]; then
            mkdir -p "$STAGED_LOCALE_DIR/images/phoneScreenshots"
            cp docs/store_assets/icon_512.png "$STAGED_LOCALE_DIR/images/icon.png"
            cp docs/store_assets/feature_graphic_1024x500.png "$STAGED_LOCALE_DIR/images/featureGraphic.png"
            cp docs/store_assets/phone_screenshots/*.png "$STAGED_LOCALE_DIR/images/phoneScreenshots/"
            cp docs/store_assets/landscape_screenshots/01_overview_landscape.png "$STAGED_LOCALE_DIR/images/phoneScreenshots/08_overview_landscape.png"
          fi

      - name: Run Fastlane Supply
        working-directory: android
        env:
          SUPPLY_JSON_KEY: ${{ runner.temp }}/play-service-account.json
          STAGED_METADATA_DIR: ${{ runner.temp }}/fastlane_metadata/android
        run: |
          bundle exec fastlane android sync_store_listing \
            metadata_path:"$STAGED_METADATA_DIR" \
            track:"${{ inputs.track }}" \
            upload_metadata:"${{ inputs.upload_metadata }}" \
            upload_images:"${{ inputs.upload_images }}" \
            validate_only:"${{ inputs.validate_only }}" \
            changes_not_sent_for_review:"${{ inputs.changes_not_sent_for_review }}"

      - name: Clean up Service Account Key
        if: always()
        run: rm -f "$RUNNER_TEMP/play-service-account.json"
