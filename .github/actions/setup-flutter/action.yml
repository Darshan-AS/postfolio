name: Set up Flutter
description: >-
  Read the pinned Flutter version from .fvmrc, install it (cached), and fetch
  dependencies. The repository must already be checked out before this runs.

runs:
  using: composite
  steps:
    - name: Read the Pinned Flutter Version
      id: sdk
      shell: bash
      run: echo "flutter=$(jq -er .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        # The SDK the code is developed and tested on, pinned once in .fvmrc. An unpinned
        # 'stable' moved to 3.50, whose new deprecations fail `dart analyze --fatal-infos`.
        flutter-version: ${{ steps.sdk.outputs.flutter }}
        cache: true

    - name: Install Dependencies
      shell: bash
      run: flutter pub get
