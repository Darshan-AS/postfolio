# The integration suites (supabase_*_test.dart) share one local Supabase stack: one GoTrue,
# one Realtime server. A bare `flutter test` therefore runs test files one at a time, so
# their sign-ups and channel subscriptions never race.
#
# The fast suite shares nothing between files. Pass --concurrency to run its files side by
# side; the flag overrides the value below (340 tests: 68 s at 1, 22 s at 14).
#
# Fast unit/controller/widget loop (no Docker required):
#   flutter test --exclude-tags integration --concurrency 8
# Real Supabase stack integration & E2E suites only, one file at a time:
#   flutter test --tags integration
concurrency: 1

tags:
  integration:
    description: Requires the local Docker Supabase stack (http://127.0.0.1:54321).
